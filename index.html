/* =============================================================================================
   SİMİT FIRINI — RADICAL UI/UX IDENTITY REBIRTH
   Theme: Taş Fırın & Boğaziçi Zanaatı (Artisan Stone Oven & Bosphorus Heritage)
   Palette: Toasted Sesame (#F3BA42), Oven Ember (#E05316), Iznik Cobalt (#1C4B74),
            Carved Walnut (#3A2012), Hearth Slate (#15201B), Flour Parchment (#FFFDF8).
   Fonts: Playfair Display (Headers/Stats), Plus Jakarta Sans (UI/Data), Patrick Hand (Chalk)
   ============================================================================================= */
@font-face { font-family: 'Patrick Hand'; font-style: normal; font-weight: 400; font-display: swap; src: url(assets/fonts/patrickhand-latin-ext.woff2) format('woff2'); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF; }
@font-face { font-family: 'Patrick Hand'; font-style: normal; font-weight: 400; font-display: swap; src: url(assets/fonts/patrickhand-latin.woff2) format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }

:root {
  /* Brand Tokens */
  --accent: #E05316;
  --accent-hi: #FF6E2E;
  --gold: #F3BA42;
  --gold-hi: #FFD470;
  --gold-d: #B88520;
  --iznik: #1C4B74;
  --iznik-hi: #2B6DA3;
  --iznik-d: #123350;
  --cream: #FAF3E6;
  --ink: #FFFBF2;
  --ink-dim: #E8DCC8;
  --ink-mute: #C8B9A0;
  --board: #15201B;
  --board-hi: #1F2E27;
  --wood: #5E361F;
  --wood-d: #2E180E;
  --paper: #FAF2E1;
  --paper-bg: #FFFDF8;
  --tint1: rgba(255, 255, 255, 0.06);
  --tint2: rgba(255, 255, 255, 0.12);
  --tint3: rgba(255, 255, 255, 0.18);
  --glass: var(--board);
  --line: rgba(243, 186, 66, 0.24);
  --star-off: rgba(255, 255, 255, 0.22);
  --good: #9ED67A;
  --bad: #FF7A60;
  --info: #F3BA42;
  --radius: 12px;
  --radius-sm: 8px;
  --hudH: 52px;

  /* Typography */
  --font: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  --display: 'Playfair Display', Georgia, 'Patrick Hand', serif;
  --hand: 'Patrick Hand', 'Segoe Print', cursive;
  --mono: 'Plus Jakarta Sans', ui-monospace, Consolas, monospace;
}

* { box-sizing: border-box; }
html, body {
  margin: 0; height: 100%; overflow: hidden;
  background: #180D07; color: var(--ink);
  font-family: var(--font);
  -webkit-tap-highlight-color: transparent;
  font-feature-settings: 'tnum';
}
body { touch-action: none; user-select: none; -webkit-user-select: none; }
canvas#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; touch-action: none; }
button, select, input { font: inherit; color: inherit; }
svg[viewBox] { width: 18px; height: 18px; flex: none; vertical-align: -3px; }
svg.arrow { width: 12px; height: 12px; }
.hidden { display: none !important; }

/* Chalkboard modal frame: deep slate stone with carved walnut border & brass bevels */
.glass {
  background:
    radial-gradient(120px 60px at 15% 10%, rgba(255, 255, 255, .04), transparent 70%),
    radial-gradient(180px 80px at 85% 90%, rgba(255, 255, 255, .03), transparent 70%),
    linear-gradient(160deg, #1C2923 0%, var(--board) 55%, #0E1612 100%);
  border: 3.5px solid var(--wood);
  border-radius: var(--radius);
  box-shadow:
    0 0 0 1.5px var(--wood-d),
    inset 0 0 0 1.5px rgba(243, 186, 66, 0.22),
    inset 0 0 36px rgba(0, 0, 0, 0.55),
    0 14px 34px rgba(10, 4, 1, 0.65);
}

/* Baker's Paper Receipt: authentic flour parchment with woven top ribbon & serrated tear */
.glass.paper {
  --ink: #24140A;
  --ink-dim: #543722;
  --ink-mute: #826045;
  --gold: #A6600E;
  --line: rgba(36, 20, 10, 0.16);
  --good: #256B24;
  --bad: #B52B14;
  --info: #1C4B74;
  --tint1: rgba(36, 20, 10, 0.05);
  --tint2: rgba(36, 20, 10, 0.09);
  --tint3: rgba(36, 20, 10, 0.15);
  --star-off: rgba(36, 20, 10, 0.18);
  color: var(--ink);
  border: 0;
  border-radius: 8px 8px 0 0;
  background:
    repeating-linear-gradient(0deg, transparent 0 28px, rgba(28, 75, 116, .07) 28px 29px),
    linear-gradient(180deg, #FFFFFF 0%, var(--paper-bg) 35%, #F4E8D0 100%);
  box-shadow: none;
  filter: drop-shadow(0 10px 22px rgba(16, 7, 2, 0.5));
  -webkit-mask: conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) 50% / 18px 100%;
  mask: conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) 50% / 18px 100%;
  padding-bottom: 26px;
}
.glass.paper::before {
  content: '';
  position: absolute; left: 0; right: 0; top: 0; height: 6px;
  background: repeating-linear-gradient(90deg, #C2410C 0 16px, #FFFDF8 16px 20px, #1C4B74 20px 36px, #FFFDF8 36px 40px);
  opacity: .95; pointer-events: none;
}

/* Tactile 3D Buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 42px; padding: 0 16px;
  border-radius: 9px;
  border: 1.5px solid rgba(243, 186, 66, 0.35);
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.1) 0%, rgba(0, 0, 0, 0.25) 100%), var(--tint1);
  cursor: pointer; font-weight: 700; font-size: 14.5px; white-space: nowrap;
  box-shadow: 0 2px 5px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.15);
  transition: background .15s, transform .08s, border-color .15s, box-shadow .15s;
}
.btn:hover { background: var(--tint3); border-color: var(--gold-hi); box-shadow: 0 3px 8px rgba(0, 0, 0, 0.45); }
.btn:active { transform: translateY(1.5px); box-shadow: 0 1px 2px rgba(0, 0, 0, 0.4); }
.paper .btn { border-color: rgba(36, 20, 10, 0.35); background: rgba(36, 20, 10, 0.05); color: var(--ink); }
.paper .btn:hover { background: rgba(36, 20, 10, 0.1); border-color: var(--gold); }

/* Radiant Oven Primary Button */
.btn.primary {
  background: linear-gradient(180deg, var(--accent-hi) 0%, var(--accent) 55%, #B33D0B 100%);
  border-color: #FFD470; color: #FFFFFF;
  box-shadow: 0 3px 0 #7A2604, 0 6px 16px rgba(224, 83, 22, 0.4);
  font-family: var(--display); font-size: 17.5px; font-weight: 700; letter-spacing: .02em;
  text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
}
.btn.primary:hover {
  background: linear-gradient(180deg, #FF7E42 0%, #E85B1F 55%, #BD420E 100%);
  border-color: #FFF2B8; box-shadow: 0 3px 0 #7A2604, 0 8px 20px rgba(224, 83, 22, 0.55);
}
.btn.primary:active { transform: translateY(2px); box-shadow: 0 1px 0 #7A2604, 0 2px 6px rgba(224, 83, 22, 0.3); }
.btn:disabled, .btn.off { opacity: .45; cursor: not-allowed; pointer-events: none; }
.btn.sm { min-height: 36px; padding: 0 11px; font-size: 13px; border-radius: 7px; }
.btn.icon { width: 40px; min-height: 40px; padding: 0; }
.btn.on { background: var(--accent); border-color: #FFD470; color: #FFFFFF; box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.35); }
.btn svg, .chip svg { width: 19px; height: 19px; flex: none; }
:focus-visible { outline: 2.5px solid var(--gold-hi); outline-offset: 2px; }
.paper :focus-visible { outline-color: var(--iznik); }

@media (pointer: coarse) {
  .btn, .btn.sm { min-height: 44px; }
  .btn.icon { width: 44px; min-height: 44px; }
}

/* =============================================================================================
   TOP HUD: Sculpted Stone Shelf with Iznik Ceramic Accent
   ============================================================================================= */
#hud.glass {
  background:
    linear-gradient(180deg, rgba(28, 17, 12, 0.96) 0%, rgba(16, 10, 7, 0.98) 100%);
  border: 1.5px solid rgba(243, 186, 66, 0.35);
  border-bottom: 3px solid var(--iznik);
  border-radius: 12px;
  box-shadow:
    inset 0 1.5px 0 rgba(255, 255, 255, 0.15),
    inset 0 -2px 0 rgba(0, 0, 0, 0.4),
    0 8px 26px rgba(10, 4, 1, 0.65);
}
#hud {
  position: fixed; top: 8px; left: 8px; right: 8px; z-index: 20;
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 6px 12px 9px 12px; flex-wrap: wrap; row-gap: 6px; /* wraps instead of overlapping when it does not fit */
}
#hud .brand {
  display: flex; align-items: center; gap: 8px;
  font-family: var(--display); font-weight: 700; font-size: 23px; color: var(--gold-hi);
  white-space: nowrap; text-shadow: 0 2px 4px rgba(0, 0, 0, 0.65);
  flex-shrink: 0;
}
#hud .brand svg { width: 34px; height: 34px; filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.5)); }
#hud .stats {
  display: flex; gap: 6px; align-items: center; justify-content: center;
  flex: 1; min-width: auto; flex-wrap: wrap;
}

/* Status Metric Chips */
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  height: 38px; padding: 0 12px; border-radius: 8px;
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.08) 0%, rgba(0, 0, 0, 0.3) 100%), var(--board);
  font-weight: 700; font-size: 14.5px; white-space: nowrap;
  border: 1.5px solid rgba(243, 186, 66, 0.25);
  box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.4), 0 1px 3px rgba(0, 0, 0, 0.3);
  font-variant-numeric: tabular-nums;
  transition: border-color .15s, background .15s;
}
.chip:hover { border-color: rgba(243, 186, 66, 0.55); }
.chip svg { color: var(--gold); width: 19px; height: 19px; }
.chip.neg { color: var(--bad); }
.chip .sub { color: var(--ink-mute); font-weight: 600; font-size: 12px; margin-left: 2px; }
.stars { display: inline-flex; gap: 2px; align-items: center; }
.stars svg { width: 17px; height: 17px; }

#hud .tools { display: flex; gap: 6px; align-items: center; flex-shrink: 0; margin-left: auto; }
.seg {
  display: inline-flex; background: rgba(0, 0, 0, 0.38);
  border: 1.5px solid rgba(243, 186, 66, 0.22);
  border-radius: 9px; padding: 2px; gap: 2px;
}
.seg .btn {
  min-height: 34px; padding: 0 10px; border: none; background: transparent;
  border-radius: 7px; font-size: 13.5px; box-shadow: none;
}
.seg .btn.on { background: var(--accent); color: #FFF; box-shadow: 0 1px 4px rgba(224, 83, 22, 0.5); }
@media (pointer: coarse) { .seg .btn { min-height: 44px; min-width: 44px; } }
#hud .btn:not(.on):not(.primary) { background: rgba(0, 0, 0, 0.35); border-color: rgba(243, 186, 66, 0.25); }

/* Glowing Day Progress Bar */
#clockbar {
  position: absolute; left: 8px; right: 8px; bottom: 0; height: 3px;
  border-radius: 2px; background: rgba(0, 0, 0, 0.5); overflow: hidden;
}
#clockbar i {
  display: block; height: 100%; width: 0;
  background: linear-gradient(90deg, var(--accent), var(--gold-hi));
  box-shadow: 0 0 8px rgba(243, 186, 66, 0.8);
}

/* =============================================================================================
   TOASTS: High-Contrast Artisan Slips
   ============================================================================================= */
#toasts {
  position: fixed; top: calc(var(--hudH) + 16px); left: 50%; transform: translateX(-50%);
  z-index: 30; display: flex; flex-direction: column; gap: 6px; align-items: center;
  pointer-events: none; width: min(480px, calc(100% - 24px));
}
.toast.glass {
  padding: 10px 16px; border-radius: 6px; font-size: 14px; font-weight: 700;
  display: flex; gap: 10px; align-items: center; animation: tin .22s cubic-bezier(0.16, 1, 0.3, 1);
  max-width: 100%; color: #24140A;
  background: linear-gradient(180deg, #FFFFFF 0%, #FFFDF8 30%, #F5E8D2 100%);
  border: 1px solid rgba(36, 20, 10, 0.15);
  border-left: 6px solid var(--info);
  box-shadow: 0 8px 20px rgba(12, 5, 1, 0.45);
}
.toast.good { border-left-color: #2F8A2E; }
.toast.bad { border-left-color: #D43618; }
.toast.info { border-left-color: var(--iznik); }
.toast svg { width: 20px; height: 20px; flex: none; }
.toast.out { opacity: 0; transform: translateY(-8px); transition: all .25s ease-in; }
@keyframes tin { from { opacity: 0; transform: translateY(-10px) scale(0.96); } }
@media (prefers-reduced-motion: reduce) {
  .toast.glass { animation: none; }
  .toast.out { transition: none; }
}

/* =============================================================================================
   PANELS: Side & Sales Cards
   ============================================================================================= */
.panel {
  position: fixed; z-index: 15; padding: 16px; overflow: auto; scrollbar-width: thin;
  max-height: calc(100% - var(--hudH) - 96px);
}
#side { top: calc(var(--hudH) + 14px); right: 8px; width: 338px; }
#sales { top: calc(var(--hudH) + 14px); left: 8px; width: 315px; }
.panel h2 {
  margin: 0; font-family: var(--display); font-weight: 700; font-size: 24px;
  color: var(--gold); line-height: 1.15; letter-spacing: .01em;
}
.paper .panel h2, .paper h2 { color: #8C470D; text-shadow: none; }
.panel h3, .modal h3 {
  margin: 14px 0 6px; font-size: 11.5px; letter-spacing: .12em; text-transform: uppercase;
  color: var(--ink-mute); font-weight: 800; border-bottom: 1.5px dashed var(--line); padding-bottom: 4px;
}
.paper h3 { color: var(--paper-dim); border-bottom-color: rgba(36, 20, 10, 0.2); }
.row { display: flex; align-items: center; gap: 8px; }
.row.sp { justify-content: space-between; }
.row.wrap { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.muted { color: var(--ink-mute); font-size: 13px; }
.paper .muted { color: var(--paper-mute); }
.sub { color: var(--ink-dim); font-size: 13px; }
.paper .sub { color: var(--paper-dim); }
.close { margin-left: auto; }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; font-size: 14px; align-items: center; }
.kv b { font-variant-numeric: tabular-nums; font-family: var(--font); font-weight: 800; font-size: 13.5px; }

.bar {
  height: 9px; border-radius: 99px; background: rgba(0, 0, 0, 0.15);
  overflow: hidden; border: 1px solid var(--line);
}
.paper .bar { background: rgba(36, 20, 10, 0.12); border-color: rgba(36, 20, 10, 0.2); }
.bar > i {
  display: block; height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--gold));
  border-radius: 99px; transition: width .25s ease-out;
}

.card {
  padding: 10px 12px; border-radius: 8px; background: var(--tint1);
  margin-bottom: 6px; font-size: 14px; border: 1.5px dashed var(--line);
}
.paper .card { background: rgba(36, 20, 10, 0.04); border-color: rgba(36, 20, 10, 0.18); }
.card .t { font-weight: 800; display: flex; gap: 6px; align-items: center; }

.tag {
  font-size: 12px; font-weight: 800; padding: 3px 9px; border-radius: 99px;
  background: var(--tint2); display: inline-flex; align-items: center; gap: 4px;
  border: 1px solid var(--line);
}
.tag.good { background: rgba(120, 190, 80, .24); color: #B9F0A2; border-color: rgba(120, 190, 80, .45); }
.tag.bad { background: rgba(240, 80, 60, .24); color: #FFBDB0; border-color: rgba(240, 80, 60, .45); }
.tag.warn { background: rgba(243, 186, 66, .24); color: var(--gold-hi); border-color: rgba(243, 186, 66, .45); }
.paper .tag.good { background: rgba(45, 125, 40, .14); color: #1E601B; border-color: rgba(45, 125, 40, .3); }
.paper .tag.bad { background: rgba(195, 50, 30, .14); color: #8F2210; border-color: rgba(195, 50, 30, .3); }
.paper .tag.warn { background: rgba(180, 95, 20, .14); color: #82430A; border-color: rgba(180, 95, 20, .3); }

.stepper { display: inline-flex; gap: 4px; align-items: center; }
.stepper b { min-width: 46px; text-align: center; font-variant-numeric: tabular-nums; font-family: var(--font); font-size: 14.5px; font-weight: 800; }

.chart {
  width: 100%; height: 96px; display: block; border-radius: 8px;
  background: #111A16; border: 2px solid var(--wood);
  box-shadow: inset 0 0 16px rgba(0, 0, 0, 0.6);
}
.legend { display: flex; gap: 12px; font-size: 12px; color: var(--ink-mute); margin-top: 6px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }

.spotrow {
  display: grid; grid-template-columns: 1fr 74px auto; gap: 8px; align-items: center;
  font-size: 14px; padding: 6px 0; border-top: 1.5px dashed var(--line);
}
.paper .spotrow { border-top-color: rgba(36, 20, 10, 0.16); }
.worker {
  display: grid; grid-template-columns: 1fr auto; gap: 4px 8px; align-items: center;
  padding: 8px 0; border-top: 1.5px dashed var(--line); font-size: 14px;
}
.paper .worker { border-top-color: rgba(36, 20, 10, 0.16); }

select.sel {
  background: var(--tint2); border: 1.5px solid var(--line); border-radius: 8px;
  min-height: 38px; padding: 0 10px; color: var(--ink); cursor: pointer; font-weight: 700;
}
select.sel option { background: var(--paper-bg); color: var(--paper-ink); }
@media (pointer: coarse) { select.sel { min-height: 44px; } }

/* =============================================================================================
   WORLD LABELS: High-Contrast Slate-Navy Pills Floating Above Stations & Spots
   ============================================================================================= */
#labels { position: fixed; inset: 0; pointer-events: none; z-index: 10; overflow: hidden; }
.lbl {
  position: absolute; left: 0; top: 0; transform: translate(-50%, -100%);
  white-space: nowrap; pointer-events: auto; cursor: pointer;
  display: flex; align-items: center; gap: 6px; padding: 4px 12px 4px 10px;
  border-radius: 99px;
  background: linear-gradient(180deg, #1B2937 0%, #0F171F 100%);
  border: 1.5px solid #D4A748;
  font-family: var(--font); font-size: 13px; font-weight: 800; color: #FFFFFF;
  min-height: 30px;
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.25),
    0 4px 12px rgba(10, 4, 1, 0.65);
  text-shadow: 0 1px 2px rgba(0, 0, 0, 0.85);
  transition: transform .12s, background .15s, border-color .15s;
}
.lbl:hover {
  transform: translate(-50%, -104%) scale(1.04);
  border-color: #FFD470;
  box-shadow: 0 6px 16px rgba(10, 4, 1, 0.8), 0 0 10px rgba(243, 186, 66, 0.4);
}
.lbl.sel {
  background: linear-gradient(180deg, var(--accent-hi) 0%, var(--accent) 100%);
  border-color: #FFD470;
  box-shadow: 0 0 16px rgba(224, 83, 22, 0.7), 0 4px 14px rgba(0, 0, 0, 0.75);
}
.lbl svg { width: 16px; height: 16px; color: var(--gold-hi); }
.lbl-badge {
  background: rgba(243, 186, 66, 0.18); border: 1px solid rgba(243, 186, 66, 0.4);
  border-radius: 99px; padding: 0 6px; font-size: 11px; color: #FFD470; font-weight: 800;
  margin-left: 2px;
}
.lbl .pip {
  width: 9px; height: 9px; border-radius: 50%;
  background: #9ED67A; border: 1px solid rgba(0, 0, 0, 0.55);
  box-shadow: 0 0 6px #9ED67A; margin-left: 2px;
}
.lbl .pip.warn { background: #FFD27A; box-shadow: 0 0 6px #FFD27A; }
.lbl .pip.bad { background: #FF6B4A; box-shadow: 0 0 8px #FF6B4A; }
/* altın pişme: the oven label and the peel button glow while bread is in its golden moment */
.lbl.gold {
  background: linear-gradient(180deg, #8A5A10 0%, #4A2E06 100%);
  border-color: #FFE08A;
  box-shadow: 0 0 18px rgba(255, 208, 64, 0.85), 0 4px 12px rgba(10, 4, 1, 0.65);
  animation: goldPulse .8s ease-in-out infinite alternate;
}
.lbl.gold .lbl-badge { background: #FFD040; color: #2A150C; border-color: #FFF2C2; }
@keyframes goldPulse { from { filter: brightness(1); } to { filter: brightness(1.3); } }
@media (pointer: coarse) { .lbl { min-height: 44px; padding: 6px 14px; } }

/* Tap-to-assign: worker selection outline & station assignment target states */
.lbl.lbl-worker {
  background: linear-gradient(180deg, #2D1A10 0%, #170E08 100%);
  border: 1.5px solid rgba(243, 186, 66, 0.45);
  z-index: 12;
}
.lbl.lbl-worker.sel {
  background: linear-gradient(180deg, #E05316 0%, #A83608 100%);
  border-color: #FFD470;
  outline: 3px solid #FFD470;
  outline-offset: 3px;
  box-shadow: 0 0 18px rgba(255, 212, 112, 0.9), 0 4px 14px rgba(0, 0, 0, 0.85);
  animation: workerPulse 0.9s ease-in-out infinite alternate;
  z-index: 25;
}
@keyframes workerPulse {
  from { outline-color: rgba(255, 212, 112, 0.5); outline-offset: 2px; }
  to { outline-color: rgba(255, 212, 112, 1); outline-offset: 4.5px; }
}
.lbl.target {
  border-color: #9ED67A;
  box-shadow: 0 0 14px rgba(158, 214, 122, 0.65), 0 4px 12px rgba(10, 4, 1, 0.7);
  animation: targetBounce 1s ease-in-out infinite alternate;
}
.lbl.target.idle-target {
  border-color: #FFD470;
  box-shadow: 0 0 18px rgba(255, 212, 112, 0.85), 0 4px 12px rgba(10, 4, 1, 0.75);
}
@keyframes targetBounce {
  from { transform: translate(-50%, -100%) scale(1); }
  to { transform: translate(-50%, -100%) scale(1.05); }
}

/* =============================================================================================
   BOTTOM DOCK: Baker's Master Tool Console
   ============================================================================================= */
#dock {
  position: fixed; z-index: 18; bottom: 22px; left: 50%; transform: translateX(-50%);
  display: flex; gap: 10px; padding: 8px 12px;
  background: linear-gradient(180deg, rgba(32, 18, 12, 0.95) 0%, rgba(18, 10, 6, 0.98) 100%);
  border: 2px solid rgba(243, 186, 66, 0.45); border-radius: 14px;
  box-shadow: 0 10px 28px rgba(0, 0, 0, 0.65), inset 0 1px 0 rgba(255, 255, 255, 0.15);
}
#dock .btn { min-height: 46px; min-width: 110px; font-size: 15px; border-radius: 9px; }
#dPeel.hot, .btn.goldy {
  background: linear-gradient(180deg, #FFE27A 0%, #E0A82A 100%); color: #2A150C; border-color: #FFF2C2;
  box-shadow: 0 0 22px rgba(255, 208, 64, 0.9), inset 0 1px 0 rgba(255, 255, 255, 0.6);
}
#dPeel.hot { animation: goldPulse .8s ease-in-out infinite alternate; }
@media (prefers-reduced-motion: reduce) { .lbl.gold, #dPeel.hot, .lbl.lbl-worker.sel, .lbl.target { animation: none; } }
#dOpen {
  animation: pulseGlow 2.5s infinite;
}
@keyframes pulseGlow {
  0%, 100% { box-shadow: 0 3px 0 #7A2604, 0 4px 12px rgba(224, 83, 22, 0.4); }
  50% { box-shadow: 0 3px 0 #7A2604, 0 6px 22px rgba(224, 83, 22, 0.85); }
}

#footer {
  position: fixed; left: 0; right: 0; bottom: 4px; text-align: center;
  font-size: 12px; color: #E8DCC8; z-index: 13; text-shadow: 0 1px 3px #000; pointer-events: none;
}
#footer a { color: var(--gold-hi); pointer-events: auto; text-decoration: none; font-weight: 700; }
#footer a:hover { text-decoration: underline; }
#hint {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: 84px; z-index: 12;
  padding: 8px 16px; font-size: 13.5px; font-weight: 600; color: var(--ink-dim);
  pointer-events: none; text-align: center; max-width: calc(100% - 24px);
  background: rgba(18, 10, 6, 0.88); border: 1.5px solid rgba(243, 186, 66, 0.35); border-radius: 99px;
  box-shadow: 0 6px 18px rgba(0, 0, 0, 0.5);
}

/* =============================================================================================
   SCREENS & MODALS: Title, Day Plan, Summary, Settings
   ============================================================================================= */
.screen {
  position: fixed; inset: 0; z-index: 40; display: flex; align-items: center;
  justify-content: center; padding: 16px;
}
.screen.dim {
  background: rgba(16, 8, 3, .72);
  backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
}
.modal {
  position: relative; width: min(580px, 100%); max-height: calc(100dvh - 24px);
  overflow: auto; padding: 26px 28px; scrollbar-width: thin;
}
.modal.wide { width: min(800px, 100%); }
.modal h1 {
  font-family: var(--display); font-weight: 700; font-size: 34px; margin: 0 0 6px;
  color: var(--gold-hi); text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5); line-height: 1.1;
  letter-spacing: .01em;
}
.paper h1 { color: #8C470D; text-shadow: none; }
.modal .menu { display: grid; gap: 10px; margin-top: 16px; }
.modal .menu .btn { min-height: 48px; font-size: 16px; }
.modal .menu .btn.primary { min-height: 52px; font-size: 20px; }

/* Title Screen */
#title {
  background: radial-gradient(ellipse at 50% 40%, rgba(32, 16, 9, .2), rgba(16, 7, 2, .85));
}
#title .box { text-align: center; padding-top: 42px; width: min(520px, 100%); }
#title .logo svg { width: 140px; height: 140px; filter: drop-shadow(0 8px 18px rgba(0, 0, 0, .6)); }
#title h1 {
  font-size: 60px; margin: 6px 0 2px; letter-spacing: .01em; line-height: 1.05;
  color: var(--gold-hi); text-shadow: 0 3px 8px rgba(0, 0, 0, 0.7);
}
#title .tag1 { color: var(--ink-dim); margin: 6px 0 16px; font-size: 16px; font-weight: 600; line-height: 1.4; }
#title .how {
  text-align: left; font-size: 14.5px; color: var(--ink-dim); background: var(--tint1);
  border-radius: 10px; border: 1.5px dashed var(--line); padding: 12px 18px 12px 36px;
  margin: 0; line-height: 1.6;
}
#title .how li { margin-bottom: 4px; }
#title .best { margin-top: 12px; font-size: 14px; color: var(--gold); font-family: var(--font); font-weight: 700; }
.bunting { position: absolute; left: 0; right: 0; top: 0; height: 42px; pointer-events: none; }
.bunting svg { width: 100%; height: 100%; display: block; }
#loadmsg { margin-top: 10px; font-size: 13.5px; color: var(--ink-mute); min-height: 20px; font-weight: 600; }

.sliderrow {
  display: grid; grid-template-columns: 120px 1fr 44px; align-items: center;
  gap: 12px; margin: 8px 0; font-size: 15px; font-weight: 700;
}
.sliderrow input[type=range] { width: 100%; accent-color: var(--accent); height: 32px; }
@media (pointer: coarse) { .sliderrow input[type=range] { height: 44px; } }

/* Plan Modal Tabs */
.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 12px 0 10px; }
.tabs .btn { min-height: 40px; font-size: 14px; }

/* Tables */
table.t { width: 100%; border-collapse: collapse; font-size: 14px; }
table.t th {
  text-align: right; color: var(--ink-mute); font-weight: 800; font-size: 12px;
  text-transform: uppercase; letter-spacing: .08em; padding: 6px 4px;
}
table.t th:first-child, table.t td:first-child { text-align: left; }
table.t td {
  padding: 8px 4px; text-align: right; border-top: 1.5px dashed var(--line);
  white-space: nowrap; font-variant-numeric: tabular-nums;
}
.paper table.t th { color: var(--paper-dim); }
.paper table.t td { border-top-color: rgba(36, 20, 10, 0.16); }
.paper table.t td:not(:first-child) { font-family: var(--font); font-size: 13.5px; font-weight: 700; }
.up { color: var(--bad); } .dn { color: var(--good); }
.big { font-family: var(--display); font-size: 32px; font-weight: 700; }

.statgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(115px, 1fr)); gap: 8px; margin: 12px 0; }
.stat {
  padding: 12px 8px; border-radius: 8px; background: var(--tint1);
  border: 1.5px dashed var(--line); text-align: center;
}
.paper .stat { background: rgba(36, 20, 10, 0.05); border-color: rgba(36, 20, 10, 0.18); }
.stat .v { font-family: var(--display); font-size: 28px; font-weight: 700; }
.stat .k { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-mute); font-weight: 800; }
.paper .stat .k { color: var(--paper-dim); }
.newrec { color: var(--gold); font-weight: 800; font-size: 15px; }

#dbg {
  position: fixed; left: 8px; bottom: 28px; z-index: 90;
  font: 12px/1.35 ui-monospace, Consolas, monospace;
  background: rgba(0, 0, 0, .85); color: #9f9; padding: 8px 10px; border-radius: 8px;
  max-width: min(520px, 90vw); white-space: pre-wrap; pointer-events: none;
}

/* =============================================================================================
   RESPONSIVE DESIGN: Tablet, Mobile, Landscape
   ============================================================================================= */
@media (max-width: 900px) {
  #side { left: 8px; right: 8px; top: auto; bottom: 78px; width: auto; max-height: 44vh; }
  #sales { left: 8px; right: 8px; width: auto; max-height: 48vh; }
  #hud .brand span { display: none; }
  #title h1 { font-size: 46px; }
  #title .logo svg { width: 105px; height: 105px; }
  #hint { display: none; }
  #dock { bottom: 18px; }
}

/* narrower than one full row: logo + controls on top, status chips on a row of their own below */
@media (max-width: 1240px) {
  #hud .tools { order: 1; }
  #hud .stats { order: 2; flex: 1 1 100%; }
}

@media (max-width: 680px) {
  #hud { left: 6px; right: 6px; padding: 4px 6px 7px 6px; }
  /* phones: the controls take the whole top row, logo and chips share the rows below */
  #hud .tools { flex: 1 1 100%; justify-content: space-between; gap: 4px; }
  #hud .brand { order: 2; }
  #hud .stats { order: 3; flex: 1 1 0; gap: 4px; }
  .seg { padding: 0; gap: 0; }
  #hud .brand svg { width: 28px; height: 28px; }
  .chip { height: 34px; padding: 0 8px; font-size: 13px; }
  .chip svg { width: 16px; height: 16px; }
  .seg .btn { min-height: 32px; padding: 0 8px; font-size: 12.5px; }
  #hud .btn.icon { width: 36px; min-height: 36px; }
}
/* phones: the dock spans the screen and its 2-3 buttons share it (3bcebe6's 110 px minimum made it wider than 360 px) */
@media (max-width: 680px) {
  #dock { left: 8px; right: 8px; transform: none; justify-content: center; gap: 6px; padding: 6px; }
  #dock .btn { flex: 1 1 0; min-width: 0; max-width: 190px; min-height: 46px; padding: 4px 8px; gap: 6px; font-size: 14px; line-height: 1.15; white-space: normal; text-align: center; }
  #dock .btn svg { flex: none; }
}
/* very narrow phones: the logo would push the chips onto a third row */
@media (max-width: 400px) { #hud .brand { display: none; } }
/* touch screens keep 44 px targets on phones too (the rule above would shrink them) */
@media (max-width: 680px) and (pointer: coarse) {
  .seg .btn { min-height: 44px; min-width: 44px; }
  #hud .btn.icon { width: 44px; min-height: 44px; }
}

@media (max-height: 560px) {
  #title .how { display: none; }
  #title .logo svg { width: 75px; height: 75px; }
  #title h1 { font-size: 36px; }
  #title .box { padding-top: 24px; }
  .bunting { height: 26px; }
}

@media (max-height: 480px) {
  .screen { padding: 8px; }
  .modal { padding: 12px 18px; }
  .modal h1 { font-size: 26px; }
  .modal .menu { gap: 6px; margin-top: 8px; }
  .modal .menu .btn { min-height: 42px; font-size: 15px; }
  .modal .menu .btn.primary { min-height: 46px; font-size: 18px; }
  #title .logo svg { width: 52px !important; height: 52px !important; }
  #title h1 { font-size: 30px; }
  #title .tag1 { margin: 2px 0 6px; font-size: 13.5px; }
  #title .best { margin-top: 4px; }
  #loadmsg { margin-top: 4px; }
  .tabs { margin: 6px 0 4px; }
}

@media (max-width: 520px) {
  table.prodt tr:first-child { display: none; }
  table.prodt, table.prodt tbody { display: block; }
  table.prodt tr { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 10px; padding: 8px 0; border-top: 1.5px dashed var(--line); }
  table.prodt td { border: 0; padding: 2px 0; text-align: left; white-space: normal; }
  table.prodt td:first-child { grid-column: 1 / -1; font-size: 15px; font-weight: 800; }
  table.prodt td[data-l]::before { content: attr(data-l); display: block; font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-mute); }
  table.prodt td[colspan] { grid-column: 1 / -1; }
  table.prodt td:empty { display: none; }
}

    else if (cz < -9.8 && cx > 3.5) { const k = rr(); base = k < 0.5 ? 0x6FA24D : k < 0.85 ? 0x7DB056 : 0x5F9145; if (Math.abs(cx - 8) < 0.8) base = 0xC9B58A; }

// ---------- action handling ----------
function afterChange() { hudUpdate(true); if (ui.planOpen) renderPlan(); renderSide(true); renderSales(true); updateLabels(true); }
function tryResult(r, okSfx) { if (!r || !r.ok) { toast(whyMsg(r && r.why || 'cash'), 'bad'); SFX.bad(); return false; } (okSfx || SFX.buy).call(SFX); return true; }
function handleAct(name, a, b) {
  audioInit(); audioResume();
  switch (name) {
    case 'tab': ui.planTab = a; SFX.click(); renderPlan(); return;
    case 'price': setPrice(a, S.sell[a] + +b); SFX.click(); break;
    case 'target': setTarget(a, S.target[a] + +b); SFX.click(); break;
    case 'recipe': if (tryResult(act('recipe', a), SFX.good)) { toast(t('p_' + a) + ' ✓', 'good'); } break;
    case 'order': if (tryResult(order(a, +b))) toast(t('tst_ordered'), 'info', 'van'); break;
    case 'stockup': { const before = S.lira; botOrders(0.9); if (S.lira < before) { SFX.buy(); toast(t('tst_ordered'), 'info', 'van'); } else SFX.bad(); break; }
    case 'sendSpot': { const w = S.workers.find(x => !x.assign); if (w) tryResult(assign(w.id, 'spot', a)); break; }
    case 'recallSpot': { const l = sellersAt(a); if (l.length) assign(l[l.length - 1].id, 'none'); SFX.click(); break; }
    case 'toSpot': tryResult(assign(+a, 'spot', b)); break;
    case 'toStation': tryResult(assign(+a, 'station', b)); break;
    case 'recallW': assign(+a, 'none'); SFX.click(); break;
    case 'fire': tryResult(act('fire', +a)); break;
    case 'hire': if (tryResult(act('hire', +a), SFX.good)) { const w = S.workers[S.workers.length - 1]; toast(t('tst_hire', w.name), 'good', 'people'); } break;
    case 'upg': { const kind = a, id = b; if (tryResult(act(kind, id || undefined), SFX.good)) toast(t('tst_upg'), 'good', 'up'); break; }
    case 'contract': if (tryResult(acceptContract(+a))) SFX.good(); break;
    case 'proof': tryResult(setProof(+a), SFX.click); break;
    case 'peel': { const r = a === '' || a === undefined ? peelAll() : peel(+a); if (!r.ok) { toast(whyMsg(r.why), 'bad', 'flame'); SFX.bad(); } break; }
    case 'plan': openPlan(); return;
    case 'planclose': closePlan(); return;
    case 'open': beginDay(); return;
    case 'sales': ui.salesOpen = !ui.salesOpen; SFX.click(); break;
    case 'deselect': UI.select(null); return;
    case 'focusSpot': UI.select('spot', a); return;
    case 'resume': setPaused(false); return;
    case 'restart': if (confirm(t('confirm_restart'))) { setPaused(false); if (S.daily) startDaily(true); else startNew(); } return;
    case 'settings': openSettings(); return;
    case 'mainmenu': setPaused(false); toTitle(); return;

  }

}
function onAssignSelect(wid, val) {
  audioInit();
  if (val === 'none') assign(+wid, 'none'); else { const [k, id] = val.split(':'); tryResult(assign(+wid, k, id)); }
  afterChange();
}
const UI = {
  select(kind, id) {
    if (kind === 'worker') {
      const wid = +id;
      if (ui.selWorker === wid) {
        ui.selWorker = 0; // tap selected worker again to deselect
      } else {
        ui.selWorker = wid;
        const w = S.workers.find(x => x.id === wid);
        if (w) toast(t('tst_worker_sel', w.name), 'info', 'people');
      }
      sel = null;
    } else if (!kind) {
      sel = null;
      ui.selWorker = 0;
    } else {
      // station, spot, or rack target
      if (ui.selWorker) {
        // Two-tap worker assignment fallback: tap worker to select, tap station/spot to assign
        const wid = ui.selWorker;
        ui.selWorker = 0;
        UI.dropWorker(wid, { kind, id });
        return;
      }
      sel = { kind, id };
      ui.selWorker = 0;
    }
    SFX.click();
    renderSide(true);
    updateLabels(true);
    if (sel && sel.kind === 'spot' && coarse) ui.salesOpen = false;
  },
  dropWorker(wid, hit) {
    const w = S.workers.find(x => x.id === wid); if (!w) return;
    if (!hit) return;
    let r;
    if (hit.kind === 'station') r = assign(wid, 'station', hit.id);
    else if (hit.kind === 'spot') r = hit.id === 'shop' ? assign(wid, 'none') : assign(wid, 'spot', hit.id);
    else if (hit.kind === 'rack') r = assign(wid, 'none');
    if (r) { if (tryResult(r)) toast(t('tst_assigned', w.name, hit.id === 'racks' ? t('idle') : hit.kind === 'station' ? t('st_' + hit.id) : t('sp_' + hit.id)), 'info', 'people'); }
    afterChange();
  },
};

  if (L.sat < 0.7 && L.missed > 8) tips.push(t('tip_miss')); if (L.burnt > 2) tips.push(t('tip_burn')); if (L.wasted > L.sold * 0.35 && L.wasted > 10) tips.push(t('tip_stale')); if (S.lira < 150) tips.push(t('tip_cash'));
  const pq = L.pq || [0, 0, 0], pqT = pq[0] + pq[1] + pq[2];
  if (pqT >= 10 && pq[2] / pqT > 0.15) tips.push(t('tip_over')); if (pqT >= 10 && pq[0] / pqT > 0.15) tips.push(t('tip_under'));

    if (FLAGS.sim) { if (!FLAGS.auto) { botOrders(0.9); closePlan(); startDay(); } fastForward(FLAGS.sim); }
  }
  updateLabels(true);
}
boot();
